<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Assistente Virtual</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <button class="hamburger-btn" id="menu-toggle" aria-label="Menu">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                    <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
                </svg>
            </button>
            <div class="header-profile">
                <div class="header-title">
                    <span class="app-name">Maria Assistente</span>
                    <div class="header-info">
                        <span class="header-status online">Online</span>
                    </div>
                </div>
            </div>
            <button class="btn-reindex" id="btn-reindex" onclick="startReindex()" title="Reindexar base de conhecimento">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                    <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
                </svg>
            </button>
        </header>

        <!-- Progress Bar -->
        <div class="reindex-progress hidden" id="reindex-progress">
            <div class="reindex-progress-bar">
                <div class="reindex-progress-fill" id="reindex-fill"></div>
            </div>
            <span class="reindex-progress-text" id="reindex-text">Reindexando...</span>
        </div>

        <!-- Chat Main -->
        <main class="chat-main">
            <!-- Placeholder (shown when no messages) -->
            <div class="chat-placeholder" id="chat-placeholder">
                <div class="placeholder-icon">
                    <svg viewBox="0 0 24 24" width="100" height="100" fill="#c5cbd0">
                        <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/>
                    </svg>
                </div>
                <h3 id="placeholder-title">Maria</h3>
                <p id="placeholder-description">Olá! Sou a Maria, assistente virtual de atendimento. Como posso ajudar você hoje?</p>
                <div class="format-help" id="format-help">
                    <strong>Exemplos de perguntas:</strong><br>
                    <code>Quero ver calcinhas de renda</code><br>
                    <code>Qual o preço do fio dental preto?</code><br>
                    <code>Tem tamanho M disponível?</code><br>
                    <code>Guia de medidas</code><br>
                    <code>Política de trocas</code>
                </div>
            </div>

            <!-- Messages Container -->
            <div class="chat-messages-area">
                <div class="messages-container hidden" id="messages"></div>
                <!-- Typing Indicator -->
                <div class="typing-indicator hidden" id="typing-indicator">
                    <div class="typing-dots">
                        <span></span><span></span><span></span>
                    </div>
                    <span class="typing-text">Digitando...</span>
                </div>
            </div>
        </main>

        <!-- Input Area -->
        <div class="chat-input-area">
            <form id="message-form" class="input-row-main">
                <div class="input-wrapper">
                    <textarea id="message-input" rows="1" placeholder="Digite uma mensagem" autocomplete="off"></textarea>
                </div>
                <button type="submit" class="send-btn" id="send-btn" disabled>
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                    </svg>
                </button>
            </form>
        </div>
    </div>

    <script src="/static/debounce.js"></script>
    <script src="/static/nav.js"></script>
    <script>renderNav("chat");</script>
    <script src="/static/client.js"></script>
</body>
</html>
