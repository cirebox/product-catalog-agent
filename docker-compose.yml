services:
  app:
    build: .
    container_name: product-catalog-agent
    ports:
      - "${SERVER_PORT:-8000}:8000"
    volumes:
      - chroma_data:/data/chroma
      - ./data/sqlite:/data/sqlite
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3

volumes:
  chroma_data:
    driver: local
